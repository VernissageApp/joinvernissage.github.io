<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Under Construction</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d1117; /* fallback until particles initialise */
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        /* full‑screen particles canvas */
        #tsparticles {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* allow clicks through */
            z-index: 0;
        }
        /* foreground content */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #f5f5f5;
        }
        h1 {
            font-size: 2.6rem;
            margin-bottom: 2rem;
            letter-spacing: 1.5px;
        }
        .logo-wrapper img {
            width: 180px;
            height: auto;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>
    <!-- animated background -->
    <div id="tsparticles"></div>

    <!-- main content -->
    <div class="content">
        <h1>Site Under Construction</h1>
        <div class="logo-wrapper">
            <!-- Embedded logo (shortened for brevity) -->
            <img id="logo" src="icon-light-rounded.svg" alt="Logo" />
        </div>
    </div>

    <!-- GSAP pulse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- tsParticles bundle (v3+) -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.0.2/tsparticles.bundle.min.js"></script>
    <script>
        // subtle logo pulse
        gsap.to("#logo", {
            scale: 1.08,
            duration: 2,
            ease: "sine.inOut",
            repeat: -1,
            yoyo: true,
        });

        // particles configuration
        const particlesOptions = {
            fpsLimit: 60,
            background: { color: "#0d1117" },
            particles: {
                number: { value: 120, density: { enable: true, area: 800 } },
                color: { value: ["#ffffff", "#60a5fa", "#67e8f9"] },
                opacity: { value: { min: 0.2, max: 0.6 } },
                size: { value: { min: 1, max: 4 } },
                move: {
                    enable: true,
                    speed: 1,
                    direction: "none",
                    outModes: { default: "out" },
                },
                shape: { type: "circle" },
            },
        };

        // initialise tsParticles – v3 syntax
        tsParticles
            .load({ id: "tsparticles", options: particlesOptions })
            .then((container) => console.log("tsParticles loaded", container))
            .catch((e) => console.error("tsParticles error", e));
    </script>
</body>
</html>
